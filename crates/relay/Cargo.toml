[package]
name = "hs-dlx-relay"
version.workspace = true
description = "Local HTTP proxy relay for the hs-dlx desktop app's web view: forwards each connection directly or through an upstream HTTP, HTTPS or SOCKS proxy"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 上游代理的 Basic 认证；与依赖树里已有的同一版
base64 = "0.22.1"
percent-encoding.workspace = true
# 与 hs-m3u8-core 经 reqwest 用的同一套：aws-lc-rs 加系统的证书校验
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-platform-verifier = "0.7.1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
# 与 reqwest 的 socks 特性用的同一版
tokio-socks = "0.5.3"
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
