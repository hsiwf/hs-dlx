[package]
name = "hs-dlx-cloud"
version.workspace = true
description = "Cloud offline-download clients for hs-dlx (PikPak), without tasks, storage or UI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 登录时生成设备号
getrandom = "0.4.3"
# 接口请求经核心发出，与下载共用代理、证书与重试设置
hs-m3u8-core.workspace = true
# PikPak 登录后申请 captcha token 时的签名（链式 md5）
md-5 = "0.11.0"
serde.workspace = true
serde_json.workspace = true
# PikPak 文件的 GCID（分块 SHA-1）
sha1 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
