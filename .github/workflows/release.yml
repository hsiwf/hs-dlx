name: release

# 发版：PR 合并进 main 时，工作区版本号（Cargo.toml 的 [workspace.package] version）还没有对应的 v<版本> 标签就发版，
# 有了就跳过。所以「合并一个 PR」与「发一个版本」是同一条路径，发版只需在 PR 里改版本号。
#
# 顺序：先核对版本号与发布说明，再由 desktop.yml 打三个平台的安装包，全部成功后建 GitHub Release。Release 先建成
# 草稿、安装包与 SHA256SUMS 传齐后才公开，公开时 GitHub 在合并提交上打 v<版本> 标签。任一步失败时没有公开的
# Release、也没有标签，在 Actions 里重跑失败的作业即可（上一次留下的同名草稿先删掉）。
#
# Release 的描述取 PR 正文的「## 发布说明」一节（见 .github/pull_request_template.md、scripts/release.py）。
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

# 先后合并的 PR 依次处理：后一个等前一个结束后再看标签在不在。GitHub 只留一个排队的运行，排队时又合并了 PR，排队的
# 那次被取消、由最新的一次接手（它看到的是包含前面改动的版本号，用的是它自己 PR 的发布说明）
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # git ls-remote --exit-code：有这个标签为 0，没有为 2，其余是查询本身失败
      - name: 版本号与是否发版
        id: version
        run: |
          version=$(python3 scripts/release.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then status=0; else status=$?; fi
          case $status in
            0) echo "v$version 已发布，这个 PR 没改版本号，不发版"; echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "发布 v$version"; echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::查询远端标签失败（退出码 $status）"; exit 1 ;;
          esac

      - name: 发布说明
        if: steps.version.outputs.release == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 scripts/release.py notes > release-notes.md

      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          if-no-files-found: error
          path: release-notes.md

  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  publish:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.plan.outputs.version }}
      TARGET: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hs-dlx-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # 三个平台各一个安装包，少了就是打包产物的名字或格式变了
      - name: 校验和
        working-directory: dist
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 3 ]; then echo "::error::安装包应为 3 个，实有 $count 个"; ls -la; exit 1; fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: 删掉上一次没发完留下的草稿
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done

      - name: 建草稿并上传安装包
        run: gh release create "$TAG" dist/* --draft --target "$TARGET" --title "hs-dlx $TAG" --notes-file release-notes.md

      # 草稿按标签查不到（标签公开时才建），按列表找回它的 id
      - name: 公开
        run: |
          ids=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ]; then echo "::error::$TAG 的草稿应为 1 个：$ids"; exit 1; fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ids" -F draft=false --jq .html_url
