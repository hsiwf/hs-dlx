name: release

# 发版：main 每收到一次推送（合并了一个 PR），看工作区版本号（Cargo.toml 的 [workspace.package] version）有没有
# v<版本> 标签：有就跳过，没有就发版。所以「合并一个 PR」与「发一个版本」是同一条路径，发版只需改版本号并在
# CHANGELOG.md 写好这个版本的一节。
#
# 顺序：先核对版本号与更新日志，再由 desktop.yml 打三个平台的安装包，全部成功后建 GitHub Release：先建草稿、安装包
# 与 SHA256SUMS 传齐后才公开，公开时 GitHub 在这个提交上打 v<版本> 标签。任一步失败时没有公开的 Release、也没有
# 标签：在 Actions 里重跑失败的作业（读的是同一个提交，上一次留下的同名草稿先删掉），或在 dev 上修好再合并一次
# （新的推送照常发这个版本）。
on:
  push:
    branches: [main]

permissions:
  contents: read

# 带上 pipefail（不写 shell 时 Linux 上是 bash -e，管道前半段失败不会让这一步失败）
defaults:
  run:
    shell: bash

# 先后推送依次处理（先进先出，最多排 100 个）：后一次等前一次结束后再看标签在不在
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # git ls-remote --exit-code：有这个标签为 0，没有为 2，其余是查询本身失败。标签在而没有公开的 Release 时失败：
      # 那是手动打的标签，或发版没走完，要人看
      - name: 版本号与是否发版
        id: version
        run: |
          version=$(python3 scripts/release.py version)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then status=0; else status=$?; fi
          case $status in
            0)
              if ! gh api "repos/$GH_REPO/releases/tags/$tag" --jq .html_url; then
                echo "::error::$tag 标签存在，但没有公开的 Release"
                exit 1
              fi
              echo "$tag 已发布，不发版"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "发布 $tag"
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::查询远端标签失败（退出码 $status）"
              exit 1
              ;;
          esac

      # 打包前先确认有发布说明，免得白打三个平台的包
      - name: 更新日志里有这个版本
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py notes "$VERSION"

  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 重跑一次过时的运行（这个版本已由后来的推送发掉）时在这里停下
      - name: 标签仍不存在
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then status=0; else status=$?; fi
          case $status in
            0) echo "::error::$TAG 已存在，这次运行已过时"; exit 1 ;;
            2) ;;
            *) echo "::error::查询远端标签失败（退出码 $status）"; exit 1 ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hs-dlx-*
          merge-multiple: true
          path: dist

      # 三个平台各一个安装包，少了就是打包产物的名字或格式变了
      - name: 校验和
        working-directory: dist
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 3 ]; then echo "::error::安装包应为 3 个，实有 $count 个"; ls -la; exit 1; fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: 发布说明
        run: python3 scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: 删掉上一次没发完留下的草稿
        run: |
          ids=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          for id in $ids; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done

      - name: 建草稿并上传安装包
        run: |
          gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" --title "hs-dlx $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # 草稿按标签查不到（REST 的按标签查询只返回公开的），按列表找回它的 id
      - name: 公开
        run: |
          ids=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ]; then echo "::error::$TAG 的草稿应为 1 个：$ids"; exit 1; fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ids" -F draft=false --jq .html_url
