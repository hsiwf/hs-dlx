[package]
name = "hs-m3u8-desktop"
version.workspace = true
description = "Desktop application for hs-m3u8, built with GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
dirs.workspace = true
fs4.workspace = true
gpui-kit.workspace = true
hs-m3u8-app = { path = "../../crates/app" }
hs-m3u8-core = { path = "../../crates/core" }
hs-m3u8-instance = { path = "../../crates/instance" }
hs-m3u8-macos = { path = "../../crates/macos" }
hs-m3u8-relay = { path = "../../crates/relay" }
hs-m3u8-webview = { path = "../../crates/webview" }
psl.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
# 托盘图标：0.x 近一年有两次不兼容升级，精确锁定；Linux 用 ksni 后端（StatusNotifierItem，纯 Rust 的 D-Bus），不要
# 默认的 GTK 与 libappindicator
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
url.workspace = true
wry.workspace = true

[lints]
workspace = true
